<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign Admin Login</title><link rel="stylesheet" href="/admin/admin.css"></head><body class="login-page"><main class="login-card"><div class="brand-mark">LISA BALLAY</div><p class="eyebrow">CAMPAIGN OPERATIONS</p><h1>Staff sign in</h1><p class="muted">Sign in to preview the campaign website or manage campaign operations.</p><form method="post" action="/admin/login"><input id="login-next" name="next" type="hidden"><label>Username<input name="username" type="text" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><p class="error" id="login-error" hidden>That username or password was not accepted.</p><button type="submit">SIGN IN</button></form></main><script>const params=new URLSearchParams(location.search);document.getElementById('login-error').hidden=params.get('error')!=='1';document.getElementById('login-next').value=params.get('next')==='/preview'?'/preview':''</script></body></html>
