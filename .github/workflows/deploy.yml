name: Deploy LB26

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lb26-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deployment archive
        run: tar --exclude=.git --exclude=.github -czf /tmp/lb26-release.tgz .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/lb26_deploy
          chmod 600 ~/.ssh/lb26_deploy
          ssh-keygen -y -f ~/.ssh/lb26_deploy > ~/.ssh/lb26_deploy.pub
          ssh-keygen -lf ~/.ssh/lb26_deploy.pub
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/lb26_deploy /tmp/lb26-release.tgz "$VPS_USER@$VPS_HOST:/tmp/lb26-release.tgz"

      - name: Deploy and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/lb26_deploy "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/apps/lb26 && tar -xzf /tmp/lb26-release.tgz -C /opt/apps/lb26 && cd /opt/apps/lb26 && docker compose up -d --build && rm -f /tmp/lb26-release.tgz && for i in 1 2 3 4 5 6; do curl -fsS http://127.0.0.1:8098/health && exit 0; sleep 5; done; docker compose logs --tail=100; exit 1'
