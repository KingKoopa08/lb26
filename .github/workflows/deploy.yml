name: Deploy LB26

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lb26-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deployment archive
        run: tar --exclude=.git --exclude=.github -czf /tmp/lb26-release.tgz .

      - name: Build production environment
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_REPLY_TO: ${{ secrets.RESEND_REPLY_TO }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
        run: |
          test -n "$POSTGRES_DB"
          test -n "$POSTGRES_USER"
          test -n "$POSTGRES_PASSWORD"
          test -n "$ADMIN_EMAIL"
          test "${#ADMIN_PASSWORD}" -ge 14
          umask 077
          {
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            printf 'SYNC_ADMIN_CREDENTIALS=true\n'
            printf 'COOKIE_SECURE=false\n'
            printf 'SESSION_TTL_HOURS=12\n'
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'RESEND_FROM_EMAIL=%s\n' "$RESEND_FROM_EMAIL"
            printf 'RESEND_REPLY_TO=%s\n' "$RESEND_REPLY_TO"
            printf 'RESEND_WEBHOOK_SECRET=%s\n' "$RESEND_WEBHOOK_SECRET"
          } > /tmp/lb26.env

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test "$VPS_HOST" = "15.204.85.154" || { echo "VPS_HOST does not match the LB26 server"; exit 1; }
          test "$VPS_USER" = "debian" || { echo "VPS_USER must be debian"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/lb26_deploy
          chmod 600 ~/.ssh/lb26_deploy
          ssh-keygen -y -f ~/.ssh/lb26_deploy > ~/.ssh/lb26_deploy.pub
          ssh-keygen -lf ~/.ssh/lb26_deploy.pub
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload release and environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp -i ~/.ssh/lb26_deploy /tmp/lb26-release.tgz /tmp/lb26.env "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Deploy and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/lb26_deploy "$VPS_USER@$VPS_HOST" 'sudo mkdir -p /opt/apps/lb26 && sudo chown -R "$(id -u):$(id -g)" /opt/apps/lb26 && tar -xzf /tmp/lb26-release.tgz -C /opt/apps/lb26 && install -m 600 /tmp/lb26.env /opt/apps/lb26/.env && cd /opt/apps/lb26 && docker compose up -d --build && rm -f /tmp/lb26-release.tgz /tmp/lb26.env && for i in 1 2 3 4 5 6; do curl -fsS http://127.0.0.1:8098/health && exit 0; sleep 5; done; docker compose logs --tail=100; exit 1'
