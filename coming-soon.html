<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Lisa Ballay for Congress | Coming Soon</title>
  <meta name="description" content="The official Lisa Ballay for Congress campaign website is coming soon.">
  <style>
    :root{color-scheme:light;--purple:#3a0660;--ink:#1e0733;--gold:#fbb701;--paper:#faf6ef}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 18% 20%,rgba(122,31,184,.12),transparent 28%),radial-gradient(circle at 82% 76%,rgba(251,183,1,.18),transparent 24%);pointer-events:none}
    main{position:relative;width:min(760px,100%);padding:clamp(42px,8vw,82px) clamp(26px,8vw,72px);text-align:center;border:1px solid rgba(58,6,96,.13);border-radius:24px;background:rgba(255,255,255,.78);box-shadow:0 30px 80px rgba(30,7,51,.12);backdrop-filter:blur(12px)}
    .mark{width:58px;height:5px;margin:0 auto 32px;border-radius:99px;background:var(--gold);box-shadow:18px -9px 0 -1px var(--purple),-18px 9px 0 -1px var(--purple)}
    .eyebrow{margin:0 0 18px;color:#7a1fb8;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(44px,9vw,82px);line-height:.88;letter-spacing:-.055em;text-transform:uppercase}
    h1 span{display:block;color:var(--purple)}
    .coming{margin:26px 0 0;font-size:clamp(18px,3vw,25px);font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    .copy{max-width:480px;margin:20px auto 0;color:rgba(30,7,51,.7);font-size:16px;line-height:1.65}
    .staff-login{display:inline-block;margin-top:28px;padding:11px 16px;border:1px solid rgba(58,6,96,.25);border-radius:9px;color:var(--purple);font-size:12px;font-weight:800;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}
    .staff-login:hover,.staff-login:focus-visible{background:var(--purple);color:#fff}
    footer{margin-top:42px;font-size:11px;line-height:1.5;color:rgba(30,7,51,.55)}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <p class="eyebrow">Louisiana's 2nd Congressional District</p>
    <h1>Lisa <span>Ballay</span></h1>
    <p class="coming">Campaign site coming soon</p>
    <p class="copy">We’re building something focused on Louisiana families, real affordability, and accountable representation. Check back soon.</p>
    <a class="staff-login" href="/preview">Campaign staff login</a>
    <footer>Paid for by Lisa Ballay for Congress</footer>
  </main>
  <script src="/analytics.js" defer></script>
</body>
</html>
